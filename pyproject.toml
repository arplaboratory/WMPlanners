[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cjepa"
version = "0.1.0"
description = "Learning World Models Continuously from Embodied Experience"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Long Quang", email = "longpquang@gmail.com"}
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "torch>=2.0",
  "torchvision>=0.15",
  "opencv-python>=4.5",
  "pillow>=9.0",
  "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pylint>=3.2",
  "ruff>=0.5",
  "mypy>=1.8",
  "ipykernel>=6.29"
]
video = [
  "decord>=0.6"
]
docs = [
  "sphinx>=7.2",
  "myst-nb>=1.1",
  "sphinx-book-theme>=1.1",
  "nbsphinx>=0.9",
  "jupytext>=1.15",
  "sphinxcontrib-bibtex",
  "sphinx-autoapi"
]

[project.scripts]
cjepa = "cjepa.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cjepa", "src/world_model"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
select = ["E", "F", "I", "UP", "B"]
line-length = 88

[tool.mypy]
python_version = "3.9"
strict = true
packages = ["cjepa", "world_model"]
