name: Pylint

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true
    - name: Setup environment
      run: |
        bash scripts/python_setup.sh --no-externals
    - name: Analysing the code with pylint
      run: |
        source .venvs/wm/bin/activate
        pylint src/**/*.py --extension-pkg-whitelist=cv2 > pylint_report.txt || true
        cat pylint_report.txt
        SCORE=$(sed -n 's/^Your code has been rated at \([-0-9.]*\)\/10.*/\1/p' pylint_report.txt)
        if [ -z "$SCORE" ]; then SCORE="0"; fi
        echo "PYLINT_SCORE=$SCORE" >> $GITHUB_ENV
      
    - name: Update Badge
      uses: Schneegans/dynamic-badges-action@v1.7.0
      with:
        auth: ${{ secrets.GIST_SECRET }}
        gistID: d09cfb9f249c9995b9fa1943d90a1d71
        filename: ds3001-pylint.json
        label: PyLint
        message: ${{ env.PYLINT_SCORE }}/10
        valColorRange: ${{ env.PYLINT_SCORE }}
        maxColorRange: 10
        minColorRange: 0