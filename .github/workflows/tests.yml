name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          if [ -f external/vjepa2/requirements.txt ]; then
            pip install -r external/vjepa2/requirements.txt
          fi
          pip install -e .[dev]
      - name: Run pytest
        env:
          PYTHONPATH: .:${{ github.workspace }}/external/vjepa2
        run: |
          mkdir -p reports
          pytest --junitxml=reports/pytest-junit.xml
      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/pytest-junit.xml
