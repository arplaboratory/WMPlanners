name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '<PYTHON_VERSION>'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check src tests
      - name: MyPy
        run: mypy src
      - name: Pylint
        run: pylint src/<PACKAGE_NAME> --output-format=text --score=y | tee reports/pylint.txt
      - name: Upload pylint artifact
        uses: actions/upload-artifact@v4
        with:
          name: pylint-report
          path: reports/pylint.txt
