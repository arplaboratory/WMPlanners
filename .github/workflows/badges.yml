name: badges

on:
  workflow_run:
    workflows: ["tests", "lint"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate placeholder badge payloads
        run: python scripts/ci/generate_badges.py
      - name: Commit badge payloads
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "ci: update badge payloads"
          file_pattern: .github/badges/*.json
